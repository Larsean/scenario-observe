<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scenario observation</title>
  <style>
    :root { color-scheme: light dark; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    body { margin: 0; background: #101820; color: #e6edf3; }
    header { position: sticky; top: 0; z-index: 2; padding: 1rem; background: #182430; border-bottom: 1px solid #394a59; }
    h1 { margin: 0 0 .75rem; font-size: 1.2rem; }
    .toolbar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
    input, button { font: inherit; color: inherit; background: #101820; border: 1px solid #617587; border-radius: .35rem; padding: .45rem .65rem; }
    button { cursor: pointer; }
    button:hover, button:focus-visible { outline: 2px solid #58a6ff; outline-offset: 1px; }
    #search { min-width: 16rem; flex: 1; }
    #summary { color: #aab9c7; font-size: .85rem; }
    .report-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(15rem, 21rem); gap: 1rem; padding: 1rem; align-items: start; }
    section { min-width: 0; }
    h2 { margin: .2rem 0 .75rem; font-size: 1rem; }
    #details-panel { min-width: 0; }
    #execution-sidebar { min-width: 0; position: sticky; top: 6rem; max-height: calc(100vh - 7rem); overflow: auto; }
    #tree-sidebar { border: 1px solid #394a59; border-radius: .5rem; overflow: hidden; }
    #tree-sidebar > summary { cursor: pointer; padding: .7rem .8rem; background: #182430; color: #e6edf3; font-weight: 600; }
    #tree-sidebar[open] > summary { border-bottom: 1px solid #394a59; }
    .sidebar-controls { display: flex; gap: .4rem; padding: .55rem; }
    .sidebar-controls button { flex: 1; padding: .3rem; font-size: .75rem; }
    .root-group { margin-bottom: 1rem; border: 1px solid #394a59; border-radius: .5rem; overflow: hidden; }
    .root-heading { margin: 0; padding: .55rem .75rem; background: #182430; color: #aab9c7; font-size: .8rem; }
    .node { margin: .3rem 0 .3rem .7rem; border-left: 1px solid #394a59; padding-left: .45rem; }
    .node-header { display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; }
    .node.selected > .node-header { outline: 2px solid #58a6ff; border-radius: .35rem; }
    .node-label { min-width: 0; max-width: 100%; flex: 1 1 auto; white-space: normal; overflow-wrap: anywhere; text-align: left; border: 0; background: transparent; }
    .node-toggle { padding: .2rem .4rem; font-size: .75rem; }
    .badge { border-radius: 1rem; padding: .15rem .45rem; background: #263746; color: #bfdbfe; font-size: .72rem; }
    .task-boundary { border: 1px solid #d29922; color: #f0c674; }
    .status-unwind, .status-incomplete { color: #ffb4a2; }
    .match > .node-header { outline: 2px solid #d29922; border-radius: .35rem; }
    .children[hidden] { display: none; }
    #detail-content { overflow-wrap: anywhere; }
    .detail-section { margin: .6rem 0; }
    .detail-section h3 { margin: .3rem 0; color: #aab9c7; font-size: .8rem; }
    .detail-section pre { margin: 0; padding: .65rem; overflow: auto; white-space: pre-wrap; background: #182430; border-radius: .35rem; }
    .structured-value { padding: .55rem .65rem; border: 1px solid #394a59; background: #182430; border-radius: .35rem; }
    .value-list { display: grid; gap: 0; margin: 0; }
    .value-row { display: grid; grid-template-columns: minmax(6rem, 1fr) minmax(0, 2fr); gap: .6rem; align-items: start; padding: .4rem .1rem; border-bottom: 1px solid #394a59; }
    .value-row:last-child { border-bottom: 0; }
    .value-row dt { color: #aab9c7; overflow-wrap: anywhere; }
    .value-row dd { min-width: 0; margin: 0; overflow-wrap: anywhere; }
    .value-scalar { white-space: pre-wrap; overflow-wrap: anywhere; }
    .empty { color: #aab9c7; padding: .5rem; }
    @media (max-width: 800px) { .report-layout { grid-template-columns: 1fr; } #execution-sidebar { position: static; max-height: none; } }
  </style>
</head>
<body>
  <header>
    <h1>Scenario observation</h1>
    <div class="toolbar">
      <label for="search">Search calls</label>
      <input id="search" type="search" autocomplete="off" placeholder="Module, function, source, input…">
      <span id="summary"></span>
    </div>
  </header>
  <main class="report-layout">
    <section id="details-panel" aria-labelledby="details-title">
      <h2 id="details-title">Node detail</h2>
      <div id="detail-content" class="empty">Select a call in the execution tree to inspect its details.</div>
    </section>
    <aside id="execution-sidebar" aria-label="Execution tree">
      <details id="tree-sidebar" open>
        <summary>Execution tree</summary>
        <div class="sidebar-controls">
          <button id="expand-all" type="button">Expand all</button>
          <button id="collapse-all" type="button">Collapse all</button>
        </div>
        <div id="execution-tree"></div>
      </details>
    </aside>
  </main>
  <script id="trace-data" type="application/json">{{TRACE_DATA}}</script>
  <script>
    (() => {
      const documentData = JSON.parse(document.getElementById("trace-data").textContent);
      const tree = document.getElementById("execution-tree");
      const search = document.getElementById("search");
      const details = document.getElementById("detail-content");
      const summary = document.getElementById("summary");
      const rootsById = new Map();
      const allNodes = [];
      const MAX_VALUE_DEPTH = 1;
      let firstSelection = null;
      let selectedTreeNode = null;

      function indexNodes(nodes) {
        for (const node of nodes) {
          rootsById.set(node.call_id, node);
          allNodes.push(node);
          indexNodes(node.children);
        }
      }

      function callName(node) {
        return `${node.symbol.module}.${node.symbol.qualname}`;
      }

      function foldSiblings(nodes) {
        const groups = [];
        for (const node of nodes) {
          const key = JSON.stringify([callName(node), node.thread_id, node.task_id, node.status]);
          const previous = groups[groups.length - 1];
          if (previous && previous.key === key) {
            previous.nodes.push(node);
          } else {
            groups.push({ key, nodes: [node] });
          }
        }
        return groups;
      }

      function nodeSearchText(group) {
        return group.nodes.map((node) => JSON.stringify([
          node.symbol, node.source, node.input, node.output, node.exception,
        ])).join("\n").toLowerCase();
      }

      function appendStructuredValue(parent, value, depth = 0) {
        if (value !== null && typeof value === "object" && depth <= MAX_VALUE_DEPTH) {
          const entries = Array.isArray(value)
            ? value.map((item, index) => [String(index), item])
            : Object.entries(value);
          if (entries.length === 0) {
            const emptyValue = window.document.createElement("code");
            emptyValue.className = "value-scalar";
            emptyValue.textContent = Array.isArray(value) ? "[]" : "{}";
            parent.append(emptyValue);
            return;
          }
          const list = window.document.createElement("dl");
          list.className = "value-list";
          for (const [key, item] of entries) {
            const row = window.document.createElement("div");
            row.className = "value-row";
            const term = window.document.createElement("dt");
            term.textContent = Array.isArray(value) ? `[${key}]` : key;
            const description = window.document.createElement("dd");
            appendStructuredValue(description, item, depth + 1);
            row.append(term, description);
            list.append(row);
          }
          parent.append(list);
          return;
        }
        const scalar = window.document.createElement("code");
        scalar.className = "value-scalar";
        scalar.textContent = typeof value === "string"
          ? value
          : JSON.stringify(value) ?? String(value);
        parent.append(scalar);
      }

      function appendStructuredDetailSection(parent, title, value) {
        const section = window.document.createElement("section");
        section.className = "detail-section";
        const heading = window.document.createElement("h3");
        heading.textContent = title;
        const content = window.document.createElement("div");
        content.className = "structured-value";
        appendStructuredValue(content, value);
        section.append(heading, content);
        parent.append(section);
      }

      function appendTextDetailSection(parent, title, value) {
        const section = window.document.createElement("section");
        section.className = "detail-section";
        const heading = window.document.createElement("h3");
        heading.textContent = title;
        const content = window.document.createElement("pre");
        content.textContent = value;
        section.append(heading, content);
        parent.append(section);
      }

      function showDetails(group, treeNode) {
        if (selectedTreeNode) {
          selectedTreeNode.classList.remove("selected");
        }
        selectedTreeNode = treeNode;
        if (selectedTreeNode) {
          selectedTreeNode.classList.add("selected");
        }
        details.replaceChildren();
        details.className = "";
        for (const node of group.nodes) {
          const heading = window.document.createElement("h3");
          heading.textContent = `${callName(node)} · ${node.status}`;
          details.append(heading);
          appendStructuredDetailSection(details, "Source", node.source);
          if (typeof node.docstring === "string") {
            appendTextDetailSection(details, "Docstring", node.docstring);
          }
          appendStructuredDetailSection(details, "Input", node.input);
          if (node.status === "return") {
            appendStructuredDetailSection(details, "Output", node.output);
            appendStructuredDetailSection(details, "Duration (ns)", node.duration_ns);
          }
          if (node.exception !== null) {
            appendStructuredDetailSection(details, "Exception", node.exception);
          }
          appendStructuredDetailSection(details, "Thread / task", {
            thread_id: node.thread_id,
            task_id: node.task_id,
            filtered_hops: node.filtered_hops,
          });
        }
      }

      function appendTree(parent, nodes) {
        for (const group of foldSiblings(nodes)) {
          const first = group.nodes[0];
          const wrapper = window.document.createElement("div");
          wrapper.className = "node";
          wrapper._searchText = nodeSearchText(group);
          const header = window.document.createElement("div");
          header.className = "node-header";
          const select = window.document.createElement("button");
          select.type = "button";
          select.className = "node-label";
          select.textContent = callName(first) + (group.nodes.length > 1 ? ` ×${group.nodes.length}` : "");
          select.addEventListener("click", () => showDetails(group, wrapper));
          header.append(select);

          const status = window.document.createElement("span");
          status.className = `badge status-${first.status}`;
          status.textContent = first.status;
          header.append(status);

          if (first.task_boundary) {
            const taskBoundary = window.document.createElement("span");
            taskBoundary.className = "badge task-boundary";
            taskBoundary.textContent = `Task boundary: ${first.task_id ?? "—"}`;
            header.append(taskBoundary);
          }

          const filteredCount = group.nodes.reduce((count, node) => count + node.filtered_hops, 0);
          if (filteredCount > 0) {
            const filtered = window.document.createElement("span");
            filtered.className = "badge";
            filtered.textContent = `⋯ ${filteredCount} filtered calls`;
            header.append(filtered);
          }

          const childNodes = group.nodes.flatMap((node) => node.children);
          let children;
          if (childNodes.length > 0) {
            const toggle = window.document.createElement("button");
            toggle.type = "button";
            toggle.className = "node-toggle";
            toggle.textContent = "Collapse";
            toggle.setAttribute("aria-expanded", "true");
            children = window.document.createElement("div");
            children.className = "children";
            toggle.addEventListener("click", () => {
              children.hidden = !children.hidden;
              toggle.textContent = children.hidden ? "Expand" : "Collapse";
              toggle.setAttribute("aria-expanded", String(!children.hidden));
            });
            header.append(toggle);
          }

          wrapper.append(header);
          if (children) {
            wrapper.append(children);
            appendTree(children, childNodes);
          }
          if (firstSelection === null) {
            firstSelection = { group, wrapper };
          }
          parent.append(wrapper);
        }
      }

      function setAllCollapsed(collapsed) {
        for (const container of tree.querySelectorAll(".children")) {
          container.hidden = collapsed;
          const toggle = container.previousElementSibling.querySelector(".node-toggle");
          toggle.textContent = collapsed ? "Expand" : "Collapse";
          toggle.setAttribute("aria-expanded", String(!collapsed));
        }
      }

      indexNodes(documentData.roots);
      const rootGroups = new Map(documentData.root_groups.map((group) => [
        JSON.stringify([group.thread_id, group.task_id]), group,
      ]));
      for (const group of rootGroups.values()) {
        const section = window.document.createElement("section");
        section.className = "root-group";
        const heading = window.document.createElement("h3");
        heading.className = "root-heading";
        heading.textContent = `Thread ${group.thread_id ?? "?"} · Task ${group.task_id ?? "—"}`;
        const rootContainer = window.document.createElement("div");
        appendTree(rootContainer, group.root_call_ids.map((callId) => rootsById.get(callId)).filter(Boolean));
        section.append(heading, rootContainer);
        tree.append(section);
      }

      if (allNodes.length === 0) {
        tree.textContent = "No calls were recorded.";
      } else if (firstSelection !== null) {
        showDetails(firstSelection.group, firstSelection.wrapper);
      }
      const truncationSummary = documentData.truncated
        ? ` · truncated: ${documentData.truncations.map((item) => item.reason).join(", ")}`
        : "";
      summary.textContent = `${allNodes.length} calls · ${documentData.status}${truncationSummary}`;
      search.addEventListener("input", () => {
        const query = search.value.trim().toLowerCase();
        for (const node of tree.querySelectorAll(".node")) {
          node.classList.toggle("match", Boolean(query) && node._searchText.includes(query));
        }
      });
      document.getElementById("expand-all").addEventListener("click", () => setAllCollapsed(false));
      document.getElementById("collapse-all").addEventListener("click", () => setAllCollapsed(true));
    })();
  </script>
</body>
</html>
